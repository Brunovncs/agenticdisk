name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (lint, test, build, smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Version pinned in rust-toolchain.toml; keep both in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked

      # Read-only end-to-end checks on a clean machine. Nothing here may change the runner:
      # `apply` is called without --yes and must stop at the confirmation step.
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = '.\target\release\agenticdisk.exe'
          function Run([string[]] $cmd) {
            $out = & $exe @cmd
            if ($LASTEXITCODE -ne 0) { throw "agenticdisk $($cmd -join ' ') exited $LASTEXITCODE`n$out" }
            $out | ConvertFrom-Json
          }

          $goals = Run @('goals')
          if ($goals.goals.Count -lt 8) { throw 'goals: expected 8 goals' }

          $rules = Run @('rules')
          if ($rules.count -lt 40) { throw "rules: only $($rules.count) rules loaded" }

          $overview = Run @('overview', '--timeout', '120')
          foreach ($area in 'system','cleanup','drivers','privacy','startup','apps','security','stability') {
            if ($null -eq $overview.sections.$area) { throw "overview: section $area missing" }
          }
          "overview: $($overview.took_ms) ms, $($overview.findings.Count) findings"

          $explain = Run @('explain', "$env:USERPROFILE\Documents")
          if (-not $explain.protected) { throw 'explain: Documents must be protected' }

          $plan = Run @('plan', 'privacy')
          if ($plan.actions.Count -gt 0) {
            $preview = Run @('apply', $plan.plan, '--actions', $plan.actions[0].id)
            if ($preview.status -ne 'awaiting_confirmation') { throw "apply without --yes must not run (status: $($preview.status))" }
          }

          $all = & $exe apply $plan.plan --actions all | ConvertFrom-Json
          if (-not $all.error) { throw 'apply --actions all must be refused' }

          # MCP handshake over stdio: initialize + tools/list, then stdin closes and the server must exit.
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}',
            '{"jsonrpc":"2.0","method":"notifications/initialized"}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          )
          $replies = $requests | & $exe mcp | ForEach-Object { $_ | ConvertFrom-Json }
          if ($replies.Count -ne 2) { throw "mcp: expected 2 replies, got $($replies.Count)" }
          if ($replies[0].result.serverInfo.name -ne 'agenticdisk') { throw 'mcp: bad initialize reply' }
          if ($replies[1].result.tools.Count -lt 11) { throw 'mcp: tools missing' }
          'smoke test passed'

      # The npm package must stay publishable: pack it (prepack stages the binary) and run it.
      - name: npm package
        shell: pwsh
        working-directory: npm
        run: |
          $ErrorActionPreference = 'Stop'
          npm pack
          $tgz = (Get-ChildItem *.tgz | Select-Object -First 1).FullName
          $goals = npm exec --yes --package=$tgz -- agenticdisk goals | ConvertFrom-Json
          if ($goals.goals.Count -lt 8) { throw 'npm package: goals did not run' }
          "packed $(Split-Path $tgz -Leaf)"

      - uses: actions/upload-artifact@v4
        with:
          name: agenticdisk-windows-x64
          path: |
            target/release/agenticdisk.exe
            npm/*.tgz
          if-no-files-found: error

  linux:
    name: Linux (portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test core
        run: cargo test -p agenticdisk-core --locked
