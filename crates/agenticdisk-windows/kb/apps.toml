# Installed-software knowledge. `appx` rules match Store package names, `win32` rules match the
# DisplayName in Add/Remove Programs (globs, case-insensitive).
#
# category: bloat    preinstalled, nobody misses it            -> grouped removal, safety safe
#           optional preinstalled, some people use it         -> listed, safety caution
#           trialware OEM antivirus/offers                    -> listed, safety caution
#           pup      potentially unwanted program / hijacker  -> security finding

