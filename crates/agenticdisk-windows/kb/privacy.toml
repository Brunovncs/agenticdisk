# --- Performance / housekeeping -------------------------------------------------------------------

[[check]]
id = "perf.game_dvr"
area = "system"
title = "Game DVR background recording is enabled"
keys = ['HKCU\System\GameConfigStore']
value = "GameDVR_Enabled"
good = [0]
missing = "bad"
severity = "info"
safety = "caution"
set = 0
note = "Costs some GPU/CPU in games. Disables Win+Alt+R 'record that'."

[[check]]
id = "cleanup.storage_sense"
area = "cleanup"
title = "Storage Sense (automatic temp/recycle cleanup) is off"
keys = ['HKCU\Software\Microsoft\Windows\CurrentVersion\StorageSense\Parameters\StoragePolicy']
value = "01"
good = [1]
missing = "bad"
severity = "low"
set = 1
