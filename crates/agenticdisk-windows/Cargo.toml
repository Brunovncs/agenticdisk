[package]
name = "agenticdisk-windows"
description = "Windows collectors for agenticdisk: system, drivers, privacy, startup, apps, security"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agenticdisk-core = { path = "../agenticdisk-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
toml = "1.1.8"
rayon = "1.12.0"
globset = "0.4.20"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
wmi = "0.18.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
