[package]
name = "agenticdisk"
description = "PC diagnostics built for AI agents: disk space, cleanup, drivers, privacy, startup, apps and security as compact JSON"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agenticdisk-core = { path = "../agenticdisk-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
agenticdisk-windows = { path = "../agenticdisk-windows" }
